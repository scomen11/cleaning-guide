<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EBF3F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121618" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cleaning">
  <meta name="description" content="Say or type any item to get its cleaning instructions.">
  <title>Cleaning Guide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/lora.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/gilda-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <form class="searchbar" id="searchform" role="search" autocomplete="off">
      <svg class="searchbar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" placeholder="Item or brand…" autocomplete="off" autocorrect="off"
             autocapitalize="none" spellcheck="false" enterkeyhint="search" aria-label="Search the cleaning guide">
      <button type="button" id="clear" class="clear" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </form>
  </header>

  <main id="main">
    <section id="home">
      <div class="arch">
        <h1>Cleaning<br>Guide</h1>
        <div class="divider" aria-hidden="true"><i></i><svg viewBox="-22 -34 44 68"><path d="M0,-34 C3,-7 7,-3 22,0 C7,3 3,7 0,34 C-3,7 -7,3 -22,0 C-7,-3 -3,-7 0,-34 Z"/></svg><i></i></div>
        <p class="arch-sub" id="arch-sub">say or type any item</p>
      </div>
      <div id="recents" class="recents" hidden>
        <h2 class="eyebrow">Recent</h2>
        <div class="chips" id="recent-chips"></div>
      </div>
      <nav id="browse" class="browse" aria-label="Browse sections"></nav>
    </section>
    <section id="results" aria-live="polite" hidden></section>
  </main>

  <div class="dock-wrap">
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <nav class="dock" aria-label="Voice controls">
      <button type="button" id="handsfree" class="dock-side" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 18 0"/><path d="M3 12v4a2 2 0 0 0 2 2h1v-6H5"/><path d="M21 12v4a2 2 0 0 1-2 2h-1v-6h1"/></svg>
        <span>Hands-free</span>
      </button>
      <button type="button" id="mic" class="mic" aria-label="Speak an item">
        <span class="mic-ring" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      </button>
      <button type="button" id="autoread" class="dock-side" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <span>Read aloud</span>
      </button>
    </nav>
  </div>
</body>
</html>
