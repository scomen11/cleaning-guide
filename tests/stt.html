<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>On-phone speech test</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
// Runs the clips in tests/audio (with added noise) through the on-phone model two ways:
// choosing among the guide's known phrases (what the app does) and free transcription.
self.__sttModel = new URLSearchParams(location.search).get('model');
const stt = await import('../stt.js');
import { searchBest } from '../search.js';
import { knownPhrases, understand } from '../phrases.js';

const params = new URLSearchParams(location.search);
const NOISES = (params.get('noise') || '0,0.02,0.05,0.1').split(',').map(Number);
const out = document.querySelector('#out');
const lines = [];
const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };
const CLIPS = { jellycat: 'jellycat-bear|jellycat-bunny', 'kyte-pants': 'kyte-pants', haakaa: 'haakaa', bottles: 'bottles', 'nose-frida': 'nosefrida', next: 'next' };

const t0 = performance.now();
await stt.loadModel();
await stt.setPhrases(knownPhrases(['next', 'repeat', 'stop', 'read it']));
log(`model ready in ${Math.round(performance.now() - t0)} ms`);

const ctx = new OfflineAudioContext(1, 1, 16000);
const tally = { choose: {}, transcribe: {} };
const topOf = (texts) => (texts.some((t) => /^next\.?$/i.test(t)) ? 'next' : searchBest(texts).results[0]?.id ?? null);
for (const noise of NOISES) {
  for (const [clip, want] of Object.entries(CLIPS)) {
    const buf = await ctx.decodeAudioData(await (await fetch(`audio/${clip}.wav`)).arrayBuffer());
    const speech = buf.getChannelData(0);
    const pre = 0.5, post = 0.9;
    const audio = new Float32Array(Math.round((pre + post) * 16000) + speech.length);
    for (let i = 0; i < audio.length; i++) audio[i] = (Math.random() * 2 - 1) * noise;
    for (let i = 0; i < speech.length; i++) audio[i + pre * 16000] += speech[i];
    const clipObj = { audio, start: pre, end: pre + speech.length / 16000 };
    const ok = (id) => want.split('|').includes(id);

    const u = await understand(clipObj, stt);
    const { choices, ms } = u;
    const chosen = topOf(u.texts.length ? u.texts : ['']);
    const { texts, ms: ms2 } = await stt.transcribeClip(clipObj);
    const heard = topOf(texts);
    tally.choose[noise] = (tally.choose[noise] || 0) + ok(chosen);
    tally.transcribe[noise] = (tally.transcribe[noise] || 0) + ok(heard);
    log(`noise ${noise} ${clip.padEnd(10)} choose: ${ok(chosen) ? 'ok  ' : 'FAIL'} ${u.how} "${u.texts[0] ?? ''}" [${choices.slice(0, 2).map((c) => `"${c.text}" ${c.score}`).join(', ')}] (${ms} ms)`
      + ` | transcribe: ${ok(heard) ? 'ok  ' : 'FAIL'} ${texts.map((t) => `"${t}"`).join(' / ') || '(nothing)'} (${ms2} ms)`);
  }
}
log('');
for (const [k, v] of Object.entries(tally)) log(`${k.padEnd(11)} ${NOISES.map((n) => `noise ${n}: ${v[n] || 0}/6`).join('   ')}`);
document.title = 'done';
</script>
</body>
</html>
