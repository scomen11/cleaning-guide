<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="90 90 380 345">
  
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="bodyClip"><path id="bodyPath" d="M196 290 C150 318 152 404 248 414 L338 414 C408 410 440 364 436 312 C448 296 460 272 456 254 C432 270 404 270 382 266 C330 258 252 262 196 290 Z"/></clipPath>
  </defs>
  <ellipse cx="290" cy="424" rx="150" ry="15" fill="#000" opacity=".07"/>
  <g filter="url(#rough)" stroke-linejoin="round" stroke-linecap="round">
    <!-- feet, tucked under -->
    <g fill="#F2A03D" stroke="#3A2E2A" stroke-width="7">
      <ellipse cx="262" cy="418" rx="27" ry="11"/>
      <ellipse cx="322" cy="420" rx="27" ry="11"/>
    </g>
    <!-- silhouette: outline pass, then fill pass, so head/neck/body read as one shape -->
    <g stroke="#3A2E2A" stroke-width="15" fill="#3A2E2A">
      <circle cx="200" cy="150" r="50"/>
      <path d="M164 176 C152 226 152 272 200 306 L272 292 C236 266 226 226 240 176 Z"/>
      <use href="#bodyPath"/>
    </g>
    <g fill="#FFFDF8">
      <circle cx="200" cy="150" r="50"/>
      <path d="M164 176 C152 226 152 272 200 306 L272 292 C236 266 226 226 240 176 Z"/>
      <use href="#bodyPath"/>
    </g>
    <!-- soft belly shading -->
    <g clip-path="url(#bodyClip)" fill="#EDE6DB" opacity=".7">
      <ellipse cx="320" cy="438" rx="150" ry="44"/>
    </g>
    <!-- wing -->
    <path d="M268 302 C318 282 398 288 414 322 C400 364 334 380 286 364 C304 346 292 320 268 302 Z"
          fill="#F1EBE1" stroke="#3A2E2A" stroke-width="6"/>
    <path d="M326 346 C350 346 376 338 394 326 M314 362 C342 363 368 357 386 346" fill="none" stroke="#3A2E2A" stroke-width="4.5" opacity=".75"/>
    <!-- scarf -->
    <path d="M160 250 C190 266 226 266 252 252 L260 278 C230 292 194 292 164 276 Z" fill="#8DB3C7" stroke="#3A2E2A" stroke-width="6"/>
    <path d="M176 272 C166 292 160 308 150 324 L176 322 C180 304 186 290 190 276 Z" fill="#8DB3C7" stroke="#3A2E2A" stroke-width="6"/>
    <circle cx="179" cy="271" r="11" fill="#8DB3C7" stroke="#3A2E2A" stroke-width="6"/>
    <!-- beak -->
    <path d="M160 138 C128 134 108 145 100 158 C116 171 146 171 164 164 Z" fill="#F2A03D" stroke="#3A2E2A" stroke-width="7"/>
    <path d="M106 158 C124 161 144 160 160 156" fill="none" stroke="#3A2E2A" stroke-width="4"/>
  </g>
  <!-- face, unroughened so it stays crisp when tiny -->
  <ellipse cx="213" cy="165" rx="15" ry="10" fill="#EE9FAE" opacity=".8"/>
  <circle cx="190" cy="134" r="9" fill="#3A2E2A"/>
  <circle cx="193" cy="130.5" r="3" fill="#fff"/>

</svg>