<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice test harness</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
<script type="module">
// Fake speech engines so the voice flow can be driven without a microphone.
// Queue what the "user says" in window.__say (arrays of alternatives); read window.__spoken.
window.__say = [];
window.__spoken = [];
window.__heard = [];

// window.__mode imitates engine quirks:
//   'final'   – normal (Android): a final result, then end
//   'nofinal' – iOS-style: results never marked final, then end
//   'hang'    – iOS-style: results never final and no end event at all
//   'flaky'   – every other start is refused with not-allowed (after the first)
//   'busy'    – iOS-style: stop() doesn't release the mic (only abort() does, after 400ms),
//               and a session started while another holds it "listens" but hears nothing
//   'deaf'    – iOS 27 bug: after the first session, every one starts (audio on) but never
//               hears speech, whatever the app does
// ?ios pretends to be an iPhone.
window.__mode = new URLSearchParams(location.search).get('mode') || 'final';
let starts = 0;
let holder = null;  // the recognizer currently holding the mic ('busy' mode)
class FakeRecognition {
  start() {
    const n = starts++;
    const mode = window.__mode;
    const deaf = (mode === 'busy' && holder && holder !== this) || (mode === 'deaf' && n > 0);
    if (mode === 'busy' && !deaf) holder = this;
    setTimeout(() => {
      if (mode === 'flaky' && n % 2 === 1) { this.onerror?.({ error: 'not-allowed' }); this.onend?.(); return; }
      this.onstart?.();
      this.onaudiostart?.();
      if (deaf) return;  // never hears anything; the app's own timeout ends it
      const alts = window.__say.shift();
      setTimeout(() => {
        if (!alts) { this.onerror?.({ error: 'no-speech' }); this.onend?.(); return; }
        window.__heard.push(alts[0]);
        const res = alts.map((t) => ({ transcript: t }));
        res.isFinal = mode === 'final' || mode === 'flaky';
        this.onresult?.({ results: [res] });
        if (mode !== 'hang' && mode !== 'busy') setTimeout(() => this.release(), mode === 'nofinal' ? 300 : 0);
      }, 60);
    }, 20);
  }
  release() {
    if (window.__mode === 'hang' || this.released) return;
    this.released = true;
    if (window.__mode === 'busy') setTimeout(() => { if (holder === this) holder = null; this.onend?.(); }, 400);
    else this.onend?.();
  }
  abort() { this.release(); }
  stop() { if (window.__mode !== 'busy') this.release(); }
}
if (location.search.includes('ios')) Object.defineProperty(navigator, 'userAgent', { value: 'Mozilla/5.0 (iPhone; CPU iPhone OS 27_2 like Mac OS X)' });
// ?nosr simulates a browser with no voice recognition (e.g. an iPhone Home Screen app).
if (location.search.includes('nosr')) delete window.webkitSpeechRecognition;
else window.SpeechRecognition = FakeRecognition;

const fakeSynth = {
  speaking: false, pending: false,
  speak(u) { if (u.text.trim()) window.__spoken.push(u.text); setTimeout(() => u.onend?.(), 5); },
  cancel() {}, getVoices: () => [], addEventListener() {},
};
Object.defineProperty(window, 'speechSynthesis', { value: fakeSynth, configurable: true });

// The app stops listening when the page is hidden; a test pane in the background counts as hidden.
Object.defineProperty(document, 'hidden', { value: false });

const html = await (await fetch('../index.html')).text();
document.body.innerHTML = new DOMParser().parseFromString(html, 'text/html').body.innerHTML;
localStorage.clear();
// ?builtin: use the phone's own recognizer (the fake above) even when pretending to be an iPhone.
if (location.search.includes('builtin')) localStorage.setItem('engine', '"phone"');
await import('../app.js');
window.__ready = true;

// ?script=a|b|c: a hands-free session where the user says a, then b, then c; prints what was spoken.
if (location.search.includes('script=')) {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  window.__say = new URLSearchParams(location.search).get('script').split('|').map((s) => [s]).concat([['stop']]);
  document.querySelector('#handsfree').click();
  for (let i = 0; i < 600 && document.body.classList.contains('handsfree'); i++) await wait(100);
  const pre = document.createElement('pre'); pre.id = 'autotest';
  pre.textContent = `${window.__spoken.join('\n')}\nrate=${localStorage.getItem('rate')} focus=${localStorage.getItem('focus')}`;
  document.body.append(pre);
}

// ?apptest: one tap with the app's own recognition, which uses the real (or a fake) microphone:
// chrome --headless=new --use-fake-ui-for-media-stream --use-fake-device-for-media-stream
//   --use-file-for-fake-audio-capture=tests/audio/mic-kyte-pants.wav --dump-dom ".../voice.html?ios&apptest"
if (location.search.includes('apptest')) {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  window.__keepAudio = true;
  const taps = +new URLSearchParams(location.search).get('apptest') || 1;
  for (let n = 0; n < taps; n++) {
    document.querySelector('#q').value = '';
    document.querySelector('#mic').click();
    for (let i = 0; i < 600 && !document.querySelector('#q').value && !/catch/.test(document.querySelector('#status').innerText); i++) await wait(100);
    await wait(300);
  }
  document.querySelector('#menu-btn').click();
  const pre = document.createElement('pre'); pre.id = 'autotest';
  const a = window.__lastAudio;
  const rms = [];
  for (let i = 0; a && i < a.length; i += 1600) {
    let s = 0;
    for (let j = i; j < Math.min(i + 1600, a.length); j++) s += a[j] * a[j];
    rms.push(Math.sqrt(s / 1600).toFixed(3));
  }
  pre.textContent = `q=${document.querySelector('#q').value}\n${document.querySelector('#vlog').textContent}\nrms per 100ms: ${rms.join(' ')}`;
  document.body.append(pre);
}

// ?autotest: tap the mic through the iPhone "deaf" bug and write what happened into the page
// (for headless runs: msedge --headless=new --dump-dom ".../voice.html?mode=deaf&ios&autotest").
if (location.search.includes('autotest')) {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const st = () => document.querySelector('#status').innerText.replace(/\n/g, ' | ');
  const out = [];
  window.__say = [['jellycat']]; document.querySelector('#mic').click(); await wait(800);
  out.push(`tap1: q=${document.querySelector('#q').value}`);
  window.__say = [['bibs']]; document.querySelector('#mic').click(); await wait(2000);
  out.push(`tap2 @2s: ${st()}`);
  await wait(4000);
  out.push(`tap2 @6s: ${st()}`);
  document.querySelector('#mic').click(); await wait(100);
  out.push(`tap3: keyboard=${document.activeElement.id === 'q'} | ${st()}`);
  window.__mode = 'final';
  window.__say = [['haakaa']]; document.querySelector('[data-retry]')?.click(); await wait(800);
  out.push(`retry (iOS recovered): q=${document.querySelector('#q').value}`);
  const pre = document.createElement('pre'); pre.id = 'autotest'; pre.textContent = out.join('\n');
  document.body.append(pre);
}
</script>
</body>
</html>
