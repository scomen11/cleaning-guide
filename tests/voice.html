<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice test harness</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
<script type="module">
// Fake speech engines so the voice flow can be driven without a microphone.
// Queue what the "user says" in window.__say (arrays of alternatives); read window.__spoken.
window.__say = [];
window.__spoken = [];
window.__heard = [];

// window.__mode imitates engine quirks:
//   'final'   – normal (Android): a final result, then end
//   'nofinal' – iOS-style: results never marked final, then end
//   'hang'    – iOS-style: results never final and no end event at all
//   'flaky'   – every other start is refused with not-allowed (after the first)
window.__mode = new URLSearchParams(location.search).get('mode') || 'final';
let starts = 0;
class FakeRecognition {
  start() {
    const n = starts++;
    const mode = window.__mode;
    setTimeout(() => {
      if (mode === 'flaky' && n % 2 === 1) { this.onerror?.({ error: 'not-allowed' }); this.onend?.(); return; }
      this.onstart?.();
      const alts = window.__say.shift();
      setTimeout(() => {
        if (!alts) { this.onerror?.({ error: 'no-speech' }); this.onend?.(); return; }
        window.__heard.push(alts[0]);
        const res = alts.map((t) => ({ transcript: t }));
        res.isFinal = mode === 'final' || mode === 'flaky';
        this.onresult?.({ results: [res] });
        if (mode !== 'hang') setTimeout(() => this.onend?.(), mode === 'nofinal' ? 300 : 0);
      }, 60);
    }, 20);
  }
  abort() { if (window.__mode !== 'hang') this.onend?.(); }
  stop() { if (window.__mode !== 'hang') this.onend?.(); }
}
// ?nosr simulates a browser with no voice recognition (e.g. an iPhone Home Screen app).
if (location.search.includes('nosr')) delete window.webkitSpeechRecognition;
else window.SpeechRecognition = FakeRecognition;

const fakeSynth = {
  speaking: false, pending: false,
  speak(u) { if (u.text.trim()) window.__spoken.push(u.text); setTimeout(() => u.onend?.(), 5); },
  cancel() {}, getVoices: () => [], addEventListener() {},
};
Object.defineProperty(window, 'speechSynthesis', { value: fakeSynth, configurable: true });

const html = await (await fetch('../index.html')).text();
document.body.innerHTML = new DOMParser().parseFromString(html, 'text/html').body.innerHTML;
localStorage.clear();
await import('../app.js');
window.__ready = true;
</script>
</body>
</html>
